apiVersion: v1
kind: ConfigMap
metadata:
  name: logix-global-config
  namespace: logix-production
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "1000"
  ENABLE_METRICS: "true"
  GATEWAY_PORT: "4000"
  AUTH_SERVICE_PORT: "4001"
  ORDER_SERVICE_PORT: "4002"
  INVENTORY_SERVICE_PORT: "4003"
  LOGISTICS_SERVICE_PORT: "4004"
  BILLING_SERVICE_PORT: "4005"
  NOTIFICATION_SERVICE_PORT: "4006"
  ANALYTICS_SERVICE_PORT: "4007"
